<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f23">
    <title>SpeakNote v1.3.2</title>

    <!-- Open Graph -->
    <meta property="og:title" content="SpeakNote — Voice Notes, Instantly">
    <meta property="og:description" content="Voice-to-text note taking with multi-language support, timestamped entries, and clipboard export. Works offline as a PWA.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SpeakNote app open on a phone, being used by someone speaking into it">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SpeakNote — Voice Notes, Instantly">
    <meta name="twitter:description" content="Voice-to-text note taking with multi-language support, timestamped entries, and clipboard export.">
    <meta name="twitter:image" content="og-image.png">
    <meta name="description" content="Voice-to-text note taking with multi-language support, timestamped entries, and clipboard export. Works offline as a PWA.">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f0f23'/%3E%3Crect x='24' y='8' width='16' height='26' rx='8' fill='%2300d4aa'/%3E%3Cpath d='M16 30c0 8.837 7.163 16 16 16s16-7.163 16-16' stroke='%2300d4aa' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3Cline x1='32' y1='46' x2='32' y2='54' stroke='%2300d4aa' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='24' y1='54' x2='40' y2='54' stroke='%2300d4aa' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0c0c1d; --bg2:#13132a; --card:#1a1a35; --card2:#20203e;
            --accent:#00d4aa; --accent2:#00b894; --accent-glow:rgba(0,212,170,0.18);
            --warn:#ffd93d; --danger:#ff6b6b; --info:#74b9ff;
            --text:#e8e8f0; --muted:#7070a0; --border:#28285a; --border2:#32326a;
            --radius:12px; --radius-sm:8px;
        }
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
        body{
            font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
            background:var(--bg); color:var(--text);
            min-height:100vh; display:flex; flex-direction:column;
            background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
        }
        /* Header */
        .header{
            padding:14px 18px; display:flex; justify-content:space-between; align-items:center;
            background:linear-gradient(180deg,#16163a 0%,var(--bg2) 100%);
            border-bottom:1px solid var(--border);
            position:sticky; top:0; z-index:100; backdrop-filter:blur(10px);
        }
        .header-left{display:flex;align-items:center;gap:10px;}
        .logo-icon{
            width:32px;height:32px;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            border-radius:8px; display:flex; align-items:center; justify-content:center;
            font-size:16px; box-shadow:0 0 12px var(--accent-glow); flex-shrink:0;
        }
        .header h1{
            font-family:'DM Mono',monospace; font-size:16px; font-weight:500;
            letter-spacing:-0.3px; color:var(--text); display:flex; align-items:center; gap:8px;
        }
        .version{
            font-size:10px; color:var(--accent); font-weight:500;
            background:var(--accent-glow); padding:2px 7px;
            border-radius:20px; border:1px solid rgba(0,212,170,0.25);
            font-family:'DM Mono',monospace;
        }
        .status{
            padding:5px 13px; border-radius:20px; font-size:11px;
            font-weight:600; text-transform:uppercase; letter-spacing:0.8px;
            font-family:'DM Mono',monospace; transition:all 0.3s ease;
        }
        .status.idle{background:var(--card2);color:var(--muted);border:1px solid var(--border2);}
        .status.listening{
            background:var(--accent);color:var(--bg);
            box-shadow:0 0 16px var(--accent-glow); animation:statusPulse 2s infinite;
        }
        .status.starting{background:var(--warn);color:#000;}
        .status.error{background:var(--danger);color:#fff;}
        @keyframes statusPulse{0%,100%{opacity:1;box-shadow:0 0 16px var(--accent-glow);}50%{opacity:0.75;box-shadow:0 0 28px var(--accent-glow);}}
        /* Debug button (in secondary row) */
        .debug-sec-btn{flex:0 0 auto;min-width:52px;opacity:0.5;}
        .debug-sec-btn.active{opacity:1;background:rgba(255,217,61,0.15);border-color:var(--warn);color:var(--warn);}
        /* Lang bar */
        .lang-bar{
            display:flex;gap:6px;padding:9px 16px;background:var(--bg2);
            border-bottom:1px solid var(--border);overflow-x:auto;
        }
        .lang-bar::-webkit-scrollbar{display:none;}
        .lang-btn{
            padding:4px 11px;border-radius:20px;border:1px solid var(--border);
            background:transparent;color:var(--muted);font-size:11px;font-weight:600;
            cursor:pointer;white-space:nowrap;transition:all 0.2s ease;
            font-family:'DM Mono',monospace;
        }
        .lang-btn:hover{border-color:var(--border2);color:var(--text);background:var(--card);}
        .lang-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}
        /* Controls */
        .controls{
            background:var(--bg2);border-bottom:1px solid var(--border);
            padding:14px 16px;display:flex;flex-direction:column;gap:10px;
        }
        .main-btn{
            width:100%;padding:16px;border-radius:var(--radius);border:none;
            font-size:15px;font-weight:700;cursor:pointer;
            display:flex;align-items:center;justify-content:center;gap:10px;
            text-transform:uppercase;letter-spacing:1px;
            font-family:'DM Mono',monospace;transition:all 0.2s ease;
            position:relative;overflow:hidden;
        }
        .main-btn::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background 0.15s;}
        .main-btn:active::after{background:rgba(255,255,255,0.1);}
        .main-btn.start{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);color:var(--bg);box-shadow:0 4px 24px rgba(0,212,170,0.25);}
        .main-btn.start:hover{box-shadow:0 4px 32px rgba(0,212,170,0.4);transform:translateY(-1px);}
        .main-btn.stop{background:linear-gradient(135deg,#ff6b6b 0%,#ee5252 100%);color:#fff;box-shadow:0 4px 24px rgba(255,107,107,0.25);}
        .main-btn.stop:hover{box-shadow:0 4px 32px rgba(255,107,107,0.4);transform:translateY(-1px);}
        .secondary{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;}
        .sec-btn{
            flex:1;padding:10px 4px;border-radius:var(--radius-sm);
            border:1px solid var(--border);background:var(--card);color:var(--muted);
            font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Mono',monospace;
            transition:all 0.18s ease;display:flex;flex-direction:column;align-items:center;gap:3px;
        }
        .sec-btn .sec-icon{font-size:15px;}
        .sec-btn:hover{border-color:var(--border2);color:var(--text);background:var(--card2);}
        .sec-btn:active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent);transform:scale(0.97);}
        /* Debug panel */
        .debug-panel{
            background:#0a0a18;border-bottom:1px solid var(--border);
            padding:10px 14px;display:none;max-height:180px;overflow-y:auto;
        }
        .debug-panel.show{display:block;}
        .debug-panel-header{
            display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
        }
        .debug-panel-title{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--warn);font-family:'DM Mono',monospace;font-weight:600;}
        .debug-clear{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;}
        .debug-log{list-style:none;}
        .debug-log li{
            font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);
            padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.04);
            line-height:1.5;word-break:break-all;
        }
        .debug-log li.err{color:#ff9999;}
        .debug-log li.ok{color:#99ffcc;}
        .debug-log li.warn{color:var(--warn);}
        .debug-log li.info{color:var(--info);}
        /* Notes */
        .notes{flex:1;background:var(--bg);padding:14px 16px;overflow-y:auto;min-height:100px;}
        .notes-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
        .notes-title{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-family:'DM Mono',monospace;font-weight:500;}
        .note-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);background:var(--card);padding:2px 8px;border-radius:20px;border:1px solid var(--border);}
        .notes-actions button{
            padding:4px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);
            background:var(--card);color:var(--muted);font-size:11px;font-weight:600;
            cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.18s;
        }
        .notes-actions button:hover{border-color:var(--danger);color:var(--danger);}
        /* Entries */
        .entry{
            padding:10px 14px;background:var(--card);border-radius:var(--radius);
            margin-bottom:7px;border:1px solid var(--border);transition:border-color 0.2s;
            animation:entryIn 0.25s ease-out both;
        }
        @keyframes entryIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
        .entry:hover{border-color:var(--border2);}
        .entry-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
        .entry-time{color:var(--muted);font-size:10px;font-family:'DM Mono',monospace;}
        .entry-badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:0.8px;font-family:'DM Mono',monospace;}
        .badge-voice{background:rgba(0,212,170,0.15);color:var(--accent);border:1px solid rgba(0,212,170,0.25);}
        .badge-note{background:rgba(255,217,61,0.12);color:var(--warn);border:1px solid rgba(255,217,61,0.2);}
        .badge-system{background:rgba(112,112,160,0.12);color:var(--muted);border:1px solid rgba(112,112,160,0.2);}
        .entry-text{font-size:14px;line-height:1.6;color:var(--text);word-break:break-word;}
        .entry textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;line-height:1.6;resize:none;outline:none;font-family:'DM Sans',sans-serif;}
        .entry.voice-entry{border-left:2px solid var(--accent);}
        .entry.manual-entry{border-left:2px solid rgba(255,217,61,0.4);}
        .entry.system-entry{border-left:2px solid rgba(112,112,160,0.35);opacity:0.7;}
        .entry.system-entry .entry-text{font-size:12px;font-family:'DM Mono',monospace;color:var(--muted);}
        /* Empty state */
        .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--muted);text-align:center;gap:10px;}
        .empty-icon{font-size:36px;opacity:0.4;}
        .empty-text{font-size:13px;font-family:'DM Mono',monospace;opacity:0.6;}
        /* Toast */
        .toast{
            position:fixed;bottom:110px;left:50%;
            transform:translateX(-50%) translateY(16px);
            background:var(--card2);color:var(--text);
            padding:11px 22px;border-radius:22px;font-size:13px;font-weight:600;
            box-shadow:0 8px 32px rgba(0,0,0,0.5);border:1px solid var(--border2);
            opacity:0;transition:all 0.28s cubic-bezier(0.34,1.56,0.64,1);
            z-index:2000;pointer-events:none;max-width:90vw;
            font-family:'DM Mono',monospace;display:flex;align-items:center;gap:8px;
        }
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
        .toast.success::before{content:'✓';color:var(--accent);}
        .toast.error::before{content:'✕';color:var(--danger);}
        /* Install banner */
        .install-banner{
            position:fixed;bottom:0;left:0;right:0;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            color:var(--bg);padding:14px 20px;
            display:flex;justify-content:space-between;align-items:center;
            z-index:3000;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.34,1.36,0.64,1);
        }
        .install-banner.show{transform:translateY(0);}
        .install-banner button{background:var(--bg);color:var(--accent);border:none;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;}
        .install-dismiss{background:transparent!important;color:rgba(0,0,0,0.4)!important;padding:4px 8px!important;font-size:18px!important;}
        /* Waveform */
        .waveform{display:none;align-items:center;gap:3px;height:18px;}
        .waveform.active{display:flex;}
        .waveform span{display:block;width:3px;border-radius:2px;background:var(--accent);height:4px;}
        .waveform span:nth-child(1){animation:wave 1s ease-in-out infinite 0.0s;}
        .waveform span:nth-child(2){animation:wave 1s ease-in-out infinite 0.15s;}
        .waveform span:nth-child(3){animation:wave 1s ease-in-out infinite 0.3s;}
        .waveform span:nth-child(4){animation:wave 1s ease-in-out infinite 0.45s;}
        .waveform span:nth-child(5){animation:wave 1s ease-in-out infinite 0.6s;}
        @keyframes wave{0%,100%{height:4px}50%{height:16px}}
        #no-sleep{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;}
        .notes::-webkit-scrollbar{width:4px;}
        .notes::-webkit-scrollbar-track{background:transparent;}
        .notes::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
        .debug-panel::-webkit-scrollbar{width:3px;}
        .debug-panel::-webkit-scrollbar-thumb{background:var(--border2);}
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo-icon">🎙️</div>
            <h1>SpeakNote <span class="version">v1.3.2</span></h1>
        </div>
        <div class="status idle" id="status">Idle</div>
    </div>

    <div class="lang-bar" id="lang-bar">
        <button class="lang-btn active" data-lang="en-US" onclick="setLang('en-US')">🇺🇸 EN</button>
        <button class="lang-btn" data-lang="es-ES" onclick="setLang('es-ES')">🇪🇸 ES</button>
        <button class="lang-btn" data-lang="fr-FR" onclick="setLang('fr-FR')">🇫🇷 FR</button>
        <button class="lang-btn" data-lang="de-DE" onclick="setLang('de-DE')">🇩🇪 DE</button>
        <button class="lang-btn" data-lang="it-IT" onclick="setLang('it-IT')">🇮🇹 IT</button>
        <button class="lang-btn" data-lang="pt-BR" onclick="setLang('pt-BR')">🇧🇷 PT</button>
        <button class="lang-btn" data-lang="ja-JP" onclick="setLang('ja-JP')">🇯🇵 JP</button>
        <button class="lang-btn" data-lang="ko-KR" onclick="setLang('ko-KR')">🇰🇷 KR</button>
        <button class="lang-btn" data-lang="zh-CN" onclick="setLang('zh-CN')">🇨🇳 CN</button>
        <button class="lang-btn" data-lang="nl-NL" onclick="setLang('nl-NL')">🇳🇱 NL</button>
    </div>

    <div class="controls">
        <button class="main-btn start" id="main-btn" onclick="toggleListening()">
            <span class="waveform" id="waveform"><span></span><span></span><span></span><span></span><span></span></span>
            <span id="btn-icon">▶</span>
            <span id="btn-text">Start Recording</span>
        </button>
        <div class="secondary">
            <button class="sec-btn" onclick="addManualNote()"><span class="sec-icon">✎</span><span>Note</span></button>
            <button class="sec-btn" onclick="undoLast()"><span class="sec-icon">↩</span><span>Undo</span></button>
            <button class="sec-btn" onclick="copyToClipboard()"><span class="sec-icon">📋</span><span>Copy</span></button>
            <button class="sec-btn" onclick="exportText()"><span class="sec-icon">⬇</span><span>Export</span></button>
            <button class="sec-btn debug-sec-btn active" onclick="toggleDebug()" id="debug-btn" title="Debug log"><span class="sec-icon">🐛</span><span>Debug</span></button>
        </div>
    </div>

    <!-- On-screen debug panel — toggle with 🐛 button -->
    <div class="debug-panel show" id="debug-panel">
        <div class="debug-panel-header">
            <span class="debug-panel-title">🐛 Debug Log</span>
            <button class="debug-clear" onclick="clearDebugLog()">Clear</button>
        </div>
        <ul class="debug-log" id="debug-log"></ul>
    </div>

    <div class="notes" id="notes">
        <div class="notes-header">
            <span class="notes-title">📝 Session Notes</span>
            <div style="display:flex;align-items:center;gap:8px">
                <span class="note-count" id="note-count">0 entries</span>
                <span class="notes-actions"><button onclick="clearNotes()">Clear all</button></span>
            </div>
        </div>
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">🎙️</div>
            <div class="empty-text">Press Start Recording to begin</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="install-banner" id="install-banner">
        <div style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;">📲 Install SpeakNote for offline use</div>
        <div style="display:flex;gap:6px;align-items:center">
            <button onclick="installPWA()">Install</button>
            <button class="install-dismiss" onclick="document.getElementById('install-banner').classList.remove('show')">✕</button>
        </div>
    </div>

    <video id="no-sleep" loop muted playsinline>
        <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAACKBtZGF0AAAC" type="video/mp4">
    </video>

    <script>
// ═══════════════════════════════════════════════════════════════════════════════
// SpeakNote v1.3
// ═══════════════════════════════════════════════════════════════════════════════

const APP_VERSION = '1.3.2';
const APP_BUILD   = '2026-05-27-5';

// ── Debug logger — logs to console AND on-screen panel ───────────────────────
var debugLines = [];
function dbg(msg, level) {
    // level: 'info'|'ok'|'warn'|'err' (default 'info')
    var lvl   = level || 'info';
    var ts    = new Date().toLocaleTimeString('en-US', {hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
    var line  = ts + ' [' + lvl.toUpperCase() + '] ' + msg;
    debugLines.push({line:line, lvl:lvl});
    if (debugLines.length > 200) debugLines.shift();
    // Console
    if (lvl === 'err')  console.error('[SN]', msg);
    else if (lvl === 'warn') console.warn('[SN]', msg);
    else console.log('[SN]', msg);
    // On-screen panel
    var ul = document.getElementById('debug-log');
    if (ul) {
        var li = document.createElement('li');
        li.className = lvl;
        li.textContent = line;
        ul.insertBefore(li, ul.firstChild);
        // Cap DOM to 100 lines
        while (ul.children.length > 100) ul.removeChild(ul.lastChild);
    }
}
function toggleDebug() {
    var panel = document.getElementById('debug-panel');
    var btn   = document.getElementById('debug-btn');
    var show  = !panel.classList.contains('show');
    panel.classList.toggle('show', show);
    btn.classList.toggle('active', show);
    if (show) panel.scrollTop = 0; // scroll to top (newest entries) on open
}
function clearDebugLog() {
    debugLines = [];
    var ul = document.getElementById('debug-log');
    if (ul) ul.innerHTML = '';
}

// ── Browser / engine detection ───────────────────────────────────────────────
// NOTE: Order matters — Edge UA contains 'Chrome' AND 'WebKit', detect first.
var UA       = navigator.userAgent;
var IS_EDGE  = /Edg\//.test(UA);
var IS_CHROME= /Chrome/.test(UA) && !IS_EDGE;
// True Safari/WebKit: WebKit present but NOT Chromium-based
var IS_WEBKIT= /WebKit/.test(UA) && !IS_CHROME && !IS_EDGE;
var IS_IOS   = /iPad|iPhone|iPod/.test(UA) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IS_MOBILE= IS_IOS || /Android/.test(UA);
// Protocol check — SpeechRecognition requires HTTPS or localhost on most browsers
var IS_SECURE = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
var ENGINE = IS_IOS ? 'iOS-WebKit' : IS_WEBKIT ? 'WebKit' : IS_EDGE ? 'Edge' : IS_CHROME ? 'Chrome' : 'Other';

// ── Engine-tuned timing ───────────────────────────────────────────────────────
// iOS WebKit needs longer delays for audio session handoff between short sessions.
var TIMING = IS_IOS ? {
    restartDelay:    700,
    // iOS WebKit STT server (Apple) — moderate backoff
    networkBackoff:  [2000, 5000, 10000, 20000],
    maxErrors:       6
} : {
    restartDelay:    120,
    // Edge (Azure STT) and Chrome (Google STT) can both rate-limit on rapid reconnects.
    // Longer backoff gives the server time to recover. Max 8 errors so it keeps trying.
    networkBackoff:  [3000, 6000, 12000, 24000, 30000, 30000],
    maxErrors:       8
};

// ── Language map ──────────────────────────────────────────────────────────────
var LANG_NAMES = {
    'en-US':'English','es-ES':'Español','fr-FR':'Français','de-DE':'Deutsch',
    'it-IT':'Italiano','pt-BR':'Português','ja-JP':'日本語','ko-KR':'한국어',
    'zh-CN':'中文','nl-NL':'Nederlands'
};

// ── Error taxonomy ────────────────────────────────────────────────────────────
var ERROR_MSG = {
    'network':              'Network error — speech service unreachable.',
    'not-allowed':          'Microphone access denied. Allow mic in browser settings.',
    'no-speech':            'No speech detected.',
    'aborted':              'Session aborted.',
    'audio-capture':        'No microphone found, or mic in use by another app.',
    'service-not-allowed':  'Speech service blocked. Try HTTPS or a different browser.',
    'bad-grammar':          'Speech grammar error.',
    'language-not-supported':'Language not supported by this browser.'
};
// These are normal short-session endings — ignore silently
var IGNORABLE = {no_speech: true, 'no-speech': true, aborted: true};
// These require stopping — no retry possible
var FATAL = {'not-allowed': true, 'service-not-allowed': true, 'audio-capture': true};

// ── State ─────────────────────────────────────────────────────────────────────
var state = {
    entries:          [],
    isListening:      false,
    recognition:      null,
    wakeLock:         null,
    settings:         {lang: 'en-US'},
    consecutiveErrors:0,
    lastCmdTime:      0,
    errorCount:       {},
    sessionLogged:    false,   // true once "Mic active" entry logged for this user session
    startAttempts:    0,       // rapid-start-fail guard counter
    guardTimer:       null,    // timeout handle for restart scheduling
    errorHandled:     false    // true when onerror already scheduled a restart, so onend skips
};
var deferredPrompt = null;

var els = {
    status:    document.getElementById('status'),
    mainBtn:   document.getElementById('main-btn'),
    btnIcon:   document.getElementById('btn-icon'),
    btnText:   document.getElementById('btn-text'),
    notes:     document.getElementById('notes'),
    toast:     document.getElementById('toast'),
    noSleep:   document.getElementById('no-sleep'),
    waveform:  document.getElementById('waveform'),
    noteCount: document.getElementById('note-count'),
    emptyState:document.getElementById('empty-state')
};

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
    dbg('v' + APP_VERSION + ' build ' + APP_BUILD, 'info');
    dbg('Engine: ' + ENGINE + ' | iOS: ' + IS_IOS + ' | Mobile: ' + IS_MOBILE + ' | Secure: ' + IS_SECURE, 'info');
    dbg('UA: ' + UA.slice(0, 120), 'info');

    // Protocol warning
    if (!IS_SECURE) {
        dbg('WARNING: page served over ' + location.protocol + ' — SpeechRecognition requires HTTPS or localhost!', 'warn');
        addEntry('system', '⚠️ SpeechRecognition requires HTTPS. Running over ' + location.protocol + ' may not work.');
    }

    // SpeechRecognition support check
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
        dbg('SpeechRecognition API: available (' + (window.SpeechRecognition ? 'unprefixed' : 'webkit-prefixed') + ')', 'ok');
    } else {
        dbg('SpeechRecognition API: NOT AVAILABLE in this browser', 'err');
        addEntry('system', '⚠️ Speech recognition not supported in this browser.');
    }

    loadSettings();     // loads lang, does NOT show a toast
    setupInstall();
    setupVisibilityHandler();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(function() { dbg('SW registered', 'ok'); })
            .catch(function(e) { dbg('SW failed: ' + e.message, 'warn'); });
    }
}

// ── Visibility: pause/resume when tab hides (mobile background) ───────────────
function setupVisibilityHandler() {
    document.addEventListener('visibilitychange', function() {
        if (document.hidden && state.isListening) {
            dbg('Tab hidden — soft-suspending recognition', 'warn');
            _abortCurrentRecog();
            updateStatus('starting', 'Paused');
        } else if (!document.hidden && state.isListening) {
            dbg('Tab visible — resuming after ' + (IS_IOS ? 1200 : 500) + 'ms', 'info');
            clearTimeout(state.guardTimer);
            state.guardTimer = setTimeout(function() {
                if (state.isListening) _startSession();
            }, IS_IOS ? 1200 : 500);
        }
    });
}

// ── Language ──────────────────────────────────────────────────────────────────
function setLang(lang) {
    state.settings.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.lang === lang);
    });
    saveSettings();
    // Only show toast if user clicked (not on init)
    if (state._langInitDone) showToast('Language: ' + LANG_NAMES[lang], 'success');
    dbg('Language set: ' + lang, 'info');
    if (state.isListening) {
        dbg('Restarting session for new language', 'info');
        _abortCurrentRecog();
        state.sessionLogged = false;
        clearTimeout(state.guardTimer);
        state.guardTimer = setTimeout(function() {
            if (state.isListening) _startSession();
        }, IS_IOS ? 800 : 300);
    }
}

// ── Entry management ──────────────────────────────────────────────────────────
function updateEntryCount() {
    var n = state.entries.filter(function(e) { return e.type !== 'system'; }).length;
    els.noteCount.textContent = n === 1 ? '1 entry' : n + ' entries';
    els.emptyState.style.display = state.entries.length === 0 ? 'flex' : 'none';
}

function addEntry(type, text, editable) {
    var time  = new Date().toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    var entry = {type:type, text:text, time:time, ts:Date.now(), editable:!!editable};
    state.entries.unshift(entry);
    renderEntry(entry, true);
    while (state.entries.length > 200) {
        state.entries.pop();
        var all = els.notes.querySelectorAll('.entry');
        if (all.length) all[all.length - 1].remove();
    }
    updateEntryCount();
}

function renderEntry(entry, prepend) {
    var div      = document.createElement('div');
    var isVoice  = entry.type === 'voice';
    var isManual = entry.type === 'manual';
    var isSystem = entry.type === 'system';
    div.className = 'entry' +
        (isVoice  ? ' voice-entry'  : '') +
        (isManual ? ' manual-entry' : '') +
        (isSystem ? ' system-entry' : '');
    div.dataset.ts = String(entry.ts);

    var badgeLabel = isVoice ? 'Voice' : isManual ? 'Note' : isSystem ? 'System' : '';
    var badgeClass = isVoice ? 'badge-voice' : isManual ? 'badge-note' : 'badge-system';
    var badgeHtml  = badgeLabel
        ? '<span class="entry-badge ' + badgeClass + '">' + badgeLabel + '</span>'
        : '';

    if (entry.editable) {
        div.innerHTML =
            '<div class="entry-meta"><span class="entry-time">' + entry.time + '</span>' + badgeHtml + '</div>' +
            '<textarea rows="1" oninput="autoResize(this);updateEntry(this)">' + escapeHtml(entry.text) + '</textarea>';
    } else {
        div.innerHTML =
            '<div class="entry-meta"><span class="entry-time">' + entry.time + '</span>' + badgeHtml + '</div>' +
            '<div class="entry-text">' + escapeHtml(entry.text) + '</div>';
    }

    var header = els.notes.querySelector('.notes-header');
    if (prepend && header && header.nextSibling) els.notes.insertBefore(div, header.nextSibling);
    else els.notes.appendChild(div);

    if (entry.editable) {
        var ta = div.querySelector('textarea');
        autoResize(ta);
        setTimeout(function() { ta.focus(); }, IS_IOS ? 350 : 0);
    }
}

function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

function updateEntry(ta) {
    var entryEl = ta.closest('.entry');
    if (!entryEl) return;
    var ts = Number(entryEl.dataset.ts);
    if (!ts) return;
    var e = state.entries.find(function(x) { return x.ts === ts; });
    if (e) e.text = ta.value;
}

function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function addManualNote() { addEntry('manual', '', true); }

function undoLast() {
    if (!state.entries.length) { showToast('Nothing to undo', 'error'); return; }
    state.entries.shift();
    var first = els.notes.querySelector('.entry');
    if (first) first.remove();
    showToast('Undone', 'success');
    updateEntryCount();
}

function clearNotes() {
    state.entries = [];
    els.notes.querySelectorAll('.entry').forEach(function(el) { el.remove(); });
    updateEntryCount();
    showToast('Notes cleared', 'success');
}

// ── Export ────────────────────────────────────────────────────────────────────
function buildText() {
    var lines = [];
    var exportable = state.entries.slice().reverse().filter(function(e) {
        return e.type === 'voice' || e.type === 'manual';
    });
    for (var i = 0; i < exportable.length; i++) {
        var e = exportable[i];
        var label = e.type === 'voice' ? '[VOICE]' : '[NOTE]';
        // Split on real newlines, indent each line
        var bodyLines = e.text.split('\n');
        var body = bodyLines.map(function(l) { return '    ' + l; }).join('\n');
        lines.push(e.time + '  ' + label + '\n' + body);
    }
    return lines.join('\n\n');
}

function copyToClipboard() {
    var exportable = state.entries.filter(function(e) { return e.type === 'voice' || e.type === 'manual'; });
    if (!exportable.length) { showToast('No notes to copy', 'error'); return; }
    var text = buildText();
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
        document.body.appendChild(ta); ta.focus(); ta.setSelectionRange(0, text.length);
        try { var ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; }
        catch(e2) { document.body.removeChild(ta); return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
            .then(function() { showToast('Copied!', 'success'); })
            .catch(function() { fallback() ? showToast('Copied!', 'success') : showToast('Copy failed', 'error'); });
    } else {
        fallback() ? showToast('Copied!', 'success') : showToast('Copy failed', 'error');
    }
}

function exportText() {
    var exportable = state.entries.filter(function(e) { return e.type === 'voice' || e.type === 'manual'; });
    if (!exportable.length) { showToast('No notes to export', 'error'); return; }
    var text = buildText();
    var blob = new Blob([text], {type:'text/plain'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url;
    a.download = 'speaknote-' + new Date().toISOString().slice(0, 10) + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
    showToast('Exported!', 'success');
}

// ═══════════════════════════════════════════════════════════════════════════════
// Speech Recognition Engine
// Architecture: non-continuous short sessions (continuous:false).
// Each session listens for one utterance, ends naturally, onend restarts fresh.
// Avoids the continuous-stream race condition on all browsers.
// ═══════════════════════════════════════════════════════════════════════════════

function processResult(transcript) {
    var now = Date.now();
    if (now - state.lastCmdTime < 300) return; // debounce
    state.lastCmdTime = now;
    var t = transcript.trim();
    if (!t) return;
    dbg('Result: "' + t.slice(0, 60) + '"', 'ok');
    if (/^(stop|pause|halt)/i.test(t)) {
        stopListening();
        addEntry('system', 'Stopped by voice command');
    } else {
        state.consecutiveErrors = 0;
        addEntry('voice', t);
    }
}

function _abortCurrentRecog() {
    if (state.recognition) {
        try {
            state.recognition.onstart  = null;
            state.recognition.onresult = null;
            state.recognition.onerror  = null;
            state.recognition.onend    = null;
            state.recognition.abort();
        } catch(e) { dbg('abort() threw: ' + e.message, 'warn'); }
        state.recognition = null;
    }
}

function _scheduleRestart(delay) {
    clearTimeout(state.guardTimer);
    state.guardTimer = setTimeout(function() {
        if (state.isListening) _startSession();
    }, delay);
}

function _buildSession() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        dbg('SpeechRecognition constructor not found', 'err');
        return null;
    }

    var recog = new SR();
    // continuous:true — keeps the session open across pauses, no per-utterance timeouts.
    // The previous race condition (onerror + onend both restarting) is now solved with
    // state.errorHandled: onerror sets it true and owns the restart; onend checks it first.
    recog.continuous      = true;
    recog.interimResults  = false;
    recog.maxAlternatives = 1;
    recog.lang            = state.settings.lang;

    recog.onstart = function() {
        dbg('onstart — lang:' + state.settings.lang + ' attempts:' + state.startAttempts, 'ok');
        state.startAttempts = 0;
        state.errorHandled  = false;
        if (!state.sessionLogged) {
            state.sessionLogged = true;
            updateStatus('listening', 'Listening');
            updateMainBtn();
            addEntry('system', '🎙️ Microphone active — ' + LANG_NAMES[state.settings.lang]);
        }
    };

    recog.onresult = function(e) {
        for (var i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) {
                processResult(e.results[i][0].transcript);
            }
        }
    };

    recog.onerror = function(e) {
        var code = e.error;
        state.errorCount[code] = (state.errorCount[code] || 0) + 1;
        dbg('onerror: ' + code + ' | consec:' + state.consecutiveErrors + ' | total:' + state.errorCount[code], 'err');

        // Fatal — stop entirely
        if (FATAL[code]) {
            var msg = ERROR_MSG[code] || code;
            showToast(msg, 'error');
            addEntry('system', '⚠️ Fatal — ' + msg);
            state.errorHandled = true;
            _haltSession();
            return;
        }

        // Ignorable — no-speech on continuous mode just means silence; stay open.
        // aborted means we called .abort() ourselves — onend handles cleanup.
        if (IGNORABLE[code]) {
            dbg('Ignorable (' + code + ') — continuous session stays open', 'info');
            // For continuous mode, no-speech doesn't end the session — do nothing.
            // aborted ends the session — onend will fire and restart if needed.
            return;
        }

        // Countable error (network etc.)
        state.consecutiveErrors++;
        var friendly = ERROR_MSG[code] || ('Unknown error: ' + code);
        dbg(friendly + ' (' + state.consecutiveErrors + '/' + TIMING.maxErrors + ')', 'warn');

        if (state.consecutiveErrors >= TIMING.maxErrors) {
            showToast('Stopped — too many errors', 'error');
            addEntry('system', '⚠️ Stopped after ' + state.consecutiveErrors + ' errors. Last: ' + code);
            state.errorHandled = true;
            _haltSession();
            return;
        }

        // Schedule restart — mark errorHandled so onend doesn't double-restart
        state.errorHandled = true;
        if (code === 'network') {
            var idx   = Math.min(state.consecutiveErrors - 1, TIMING.networkBackoff.length - 1);
            var delay = TIMING.networkBackoff[idx];
            dbg('Network backoff ' + (delay/1000) + 's', 'warn');
            addEntry('system', '⚠️ Network error (attempt ' + state.consecutiveErrors + ') — retrying in ' + (delay/1000) + 's');
            if (state.consecutiveErrors === 1) showToast(friendly, 'error');
            // abort() triggers onend which will see errorHandled=true and skip
            // We schedule restart ourselves here with the backoff delay
            _abortCurrentRecog();
            _scheduleRestart(delay);
        } else {
            showToast(friendly, 'error');
            _abortCurrentRecog();
            _scheduleRestart(TIMING.restartDelay * 4);
        }
    };

    recog.onend = function() {
        dbg('onend | isListening:' + state.isListening + ' errorHandled:' + state.errorHandled, 'info');
        if (!state.isListening) {
            dbg('onend: stopped by user, not restarting', 'info');
            return;
        }
        if (state.errorHandled) {
            // onerror already owns the restart — reset flag and do nothing
            dbg('onend: errorHandled=true, restart already scheduled', 'info');
            state.errorHandled = false;
            return;
        }
        // Clean end (shouldn't happen often with continuous:true, but handle it)
        dbg('onend: clean end — restarting after ' + TIMING.restartDelay + 'ms', 'info');
        _scheduleRestart(TIMING.restartDelay);
    };

    return recog;
}

function _startSession() {
    if (!state.isListening) {
        dbg('_startSession called but isListening=false, ignoring', 'warn');
        return;
    }

    state.startAttempts++;
    dbg('_startSession attempt #' + state.startAttempts, 'info');

    if (state.startAttempts > 10) {
        dbg('Too many start attempts — halting', 'err');
        addEntry('system', '⚠️ Could not start mic after 10 attempts. Check permissions and HTTPS.');
        _haltSession();
        return;
    }

    // Always tear down the old instance cleanly first
    _abortCurrentRecog();

    // On iOS: blur focused element — keyboard open + recognition = conflict
    if (IS_IOS && document.activeElement && document.activeElement !== document.body) {
        document.activeElement.blur();
    }

    var recog = _buildSession();
    if (!recog) {
        addEntry('system', '⚠️ SpeechRecognition not available. Requires HTTPS + supported browser.');
        _haltSession();
        return;
    }

    state.recognition = recog;

    try {
        recog.start();
        dbg('recog.start() called', 'info');
    } catch(e) {
        dbg('recog.start() threw: ' + e.name + ': ' + e.message, 'err');
        state.recognition = null;
        if (e.name === 'InvalidStateError') {
            // Recognition already started — wait and retry
            _scheduleRestart(500);
        } else {
            addEntry('system', '⚠️ Mic start failed: ' + e.message);
            _scheduleRestart(TIMING.networkBackoff[0]);
        }
    }
}

function _haltSession() {
    dbg('_haltSession called', 'info');
    clearTimeout(state.guardTimer);
    state.isListening   = false;
    state.sessionLogged = false;
    state.errorHandled  = false;
    state.startAttempts = 0;
    _abortCurrentRecog();
    releaseWakeLock();
    updateStatus('idle', 'Idle');
    updateMainBtn();
}

// ── Public toggle — called by button ──────────────────────────────────────────
function toggleListening() {
    dbg('toggleListening | isListening:' + state.isListening, 'info');

    if (state.isListening) {
        stopListening();
        return;
    }

    // Immediate UI feedback so user knows the tap registered
    state.isListening      = true;
    state.consecutiveErrors = 0;
    state.sessionLogged    = false;
    state.nextRestartDelay = 0;
    state.startAttempts    = 0;
    updateStatus('starting', 'Starting…');
    updateMainBtn();

    // HTTPS check
    if (!IS_SECURE) {
        dbg('Blocked: not HTTPS', 'err');
        showToast('HTTPS required for mic access', 'error');
        addEntry('system', '⚠️ Speech recognition requires HTTPS. This page is on ' + location.protocol);
        _haltSession();
        return;
    }

    // Wake lock — best-effort, never block on failure
    acquireWakeLock().catch(function(e) { dbg('WakeLock failed: ' + e, 'warn'); });

    // iOS only: pre-warm audio permission via getUserMedia, then start recognition.
    // On Chrome/Edge this is unnecessary and can cause extra permission prompts.
    if (IS_IOS && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        dbg('iOS: pre-warming getUserMedia', 'info');
        navigator.mediaDevices.getUserMedia({audio:true})
            .then(function(stream) {
                stream.getTracks().forEach(function(t) { t.stop(); });
                dbg('getUserMedia OK — starting session in 250ms', 'ok');
                setTimeout(function() {
                    if (state.isListening) _startSession();
                }, 250);
            })
            .catch(function(e) {
                dbg('getUserMedia denied: ' + e.message, 'err');
                showToast('Microphone access denied', 'error');
                addEntry('system', '⚠️ Mic permission denied: ' + e.message);
                _haltSession();
            });
    } else {
        // Chrome / Edge / desktop: start directly
        _startSession();
    }
}

function stopListening() {
    dbg('stopListening called', 'info');
    state.consecutiveErrors = 0;
    _haltSession();
    addEntry('system', '⏹ Stopped');
}

// ── Wake lock ─────────────────────────────────────────────────────────────────
function acquireWakeLock() {
    if ('wakeLock' in navigator) {
        return navigator.wakeLock.request('screen')
            .then(function(wl) { state.wakeLock = wl; dbg('WakeLock acquired', 'ok'); })
            .catch(function(e) { dbg('WakeLock request failed: ' + e.message, 'warn'); });
    }
    // Fallback: silent video loop
    return els.noSleep.play().catch(function() {});
}
function releaseWakeLock() {
    if (state.wakeLock) {
        state.wakeLock.release().catch(function(){});
        state.wakeLock = null;
        dbg('WakeLock released', 'info');
    }
    try { els.noSleep.pause(); } catch(e) {}
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function updateStatus(type, text) {
    els.status.className   = 'status ' + type;
    els.status.textContent = text;
}
function updateMainBtn() {
    if (state.isListening) {
        els.mainBtn.className   = 'main-btn stop';
        els.btnIcon.textContent = '⏹';
        els.btnText.textContent = 'Stop Recording';
        els.waveform.classList.add('active');
    } else {
        els.mainBtn.className   = 'main-btn start';
        els.btnIcon.textContent = '▶';
        els.btnText.textContent = 'Start Recording';
        els.waveform.classList.remove('active');
    }
}

var toastTimer;
function showToast(msg, type) {
    clearTimeout(toastTimer);
    els.toast.textContent = msg;
    els.toast.className   = 'toast show ' + (type || '');
    toastTimer = setTimeout(function() { els.toast.classList.remove('show'); }, 3200);
}

// ── Settings ──────────────────────────────────────────────────────────────────
function loadSettings() {
    try {
        var s = localStorage.getItem('speaknote_settings');
        if (s) Object.assign(state.settings, JSON.parse(s));
    } catch(e) { dbg('loadSettings error: ' + e.message, 'warn'); }
    state._langInitDone = false;
    setLang(state.settings.lang);   // no toast on init
    state._langInitDone = true;
}
function saveSettings() {
    try { localStorage.setItem('speaknote_settings', JSON.stringify(state.settings)); }
    catch(e) { dbg('saveSettings error: ' + e.message, 'warn'); }
}

// ── PWA install ───────────────────────────────────────────────────────────────
function setupInstall() {
    window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault(); deferredPrompt = e;
        document.getElementById('install-banner').classList.add('show');
    });
    window.addEventListener('appinstalled', function() {
        deferredPrompt = null;
        document.getElementById('install-banner').classList.remove('show');
        showToast('SpeakNote installed!', 'success');
    });
}
function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(r) {
        if (r.outcome === 'accepted') document.getElementById('install-banner').classList.remove('show');
        deferredPrompt = null;
    });
}

init();
