<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f23">
    <title>SpeakNote v1.2.1</title>

    <!-- Open Graph -->
    <meta property="og:title" content="SpeakNote — Voice Notes, Instantly">
    <meta property="og:description" content="Voice-to-text note taking with multi-language support, timestamped entries, and clipboard export. Works offline as a PWA.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="SpeakNote app open on a phone, being used by someone speaking into it">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SpeakNote — Voice Notes, Instantly">
    <meta name="twitter:description" content="Voice-to-text note taking with multi-language support, timestamped entries, and clipboard export.">
    <meta name="twitter:image" content="og-image.png">

    <!-- General -->
    <meta name="description" content="Voice-to-text note taking with multi-language support, timestamped entries, and clipboard export. Works offline as a PWA.">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <!-- Inline SVG favicon — no external file needed -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f0f23'/%3E%3Crect x='24' y='8' width='16' height='26' rx='8' fill='%2300d4aa'/%3E%3Cpath d='M16 30c0 8.837 7.163 16 16 16s16-7.163 16-16' stroke='%2300d4aa' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3Cline x1='32' y1='46' x2='32' y2='54' stroke='%2300d4aa' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='24' y1='54' x2='40' y2='54' stroke='%2300d4aa' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c1d; --bg2: #13132a; --card: #1a1a35; --card2: #20203e;
            --accent: #00d4aa; --accent2: #00b894; --accent-glow: rgba(0,212,170,0.18);
            --warn: #ffd93d; --danger: #ff6b6b; --info: #74b9ff; --text: #e8e8f0; --muted: #7070a0;
            --border: #28285a; --border2: #32326a;
            --radius: 12px; --radius-sm: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Subtle noise texture for depth */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
        }

        /* ── Header ── */
        .header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #16163a 0%, var(--bg2) 100%);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 12px var(--accent-glow);
            flex-shrink: 0;
        }
        .header h1 {
            font-family: 'DM Mono', monospace;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .version {
            font-size: 10px; color: var(--accent); font-weight: 500;
            background: var(--accent-glow); padding: 2px 7px;
            border-radius: 20px; border: 1px solid rgba(0,212,170,0.25);
            font-family: 'DM Mono', monospace;
        }
        .status {
            padding: 5px 13px; border-radius: 20px; font-size: 11px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px;
            font-family: 'DM Mono', monospace;
            transition: all 0.3s ease;
        }
        .status.idle { background: var(--card2); color: var(--muted); border: 1px solid var(--border2); }
        .status.listening {
            background: var(--accent); color: var(--bg);
            box-shadow: 0 0 16px var(--accent-glow);
            animation: statusPulse 2s infinite;
        }
        .status.error { background: var(--danger); color: #fff; }
        @keyframes statusPulse { 0%,100%{opacity:1; box-shadow: 0 0 16px var(--accent-glow);} 50%{opacity:0.75; box-shadow: 0 0 28px var(--accent-glow);} }

        /* ── Language Bar ── */
        .lang-bar {
            display: flex; gap: 6px; padding: 9px 16px;
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        .lang-bar::-webkit-scrollbar { display: none; }
        .lang-btn {
            padding: 4px 11px; border-radius: 20px;
            border: 1px solid var(--border); background: transparent;
            color: var(--muted); font-size: 11px; font-weight: 600;
            cursor: pointer; white-space: nowrap;
            transition: all 0.2s ease;
            font-family: 'DM Mono', monospace;
        }
        .lang-btn:hover { border-color: var(--border2); color: var(--text); background: var(--card); }
        .lang-btn.active {
            background: var(--accent); color: var(--bg);
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* ── Controls ── */
        .controls {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .main-btn {
            width: 100%; padding: 16px; border-radius: var(--radius);
            border: none; font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 1px;
            font-family: 'DM Mono', monospace;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .main-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.15s;
        }
        .main-btn:active::after { background: rgba(255,255,255,0.1); }
        .main-btn.start {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            color: var(--bg);
            box-shadow: 0 4px 24px rgba(0,212,170,0.25);
        }
        .main-btn.start:hover { box-shadow: 0 4px 32px rgba(0,212,170,0.4); transform: translateY(-1px); }
        .main-btn.stop {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5252 100%);
            color: #fff;
            box-shadow: 0 4px 24px rgba(255,107,107,0.25);
        }
        .main-btn.stop:hover { box-shadow: 0 4px 32px rgba(255,107,107,0.4); transform: translateY(-1px); }
        .btn-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: currentColor;
            animation: none;
        }
        .main-btn.stop .btn-dot { animation: recDot 1s infinite; }
        @keyframes recDot { 0%,100%{opacity:1} 50%{opacity:0.2} }

        .secondary { display: flex; gap: 6px; }
        .sec-btn {
            flex: 1; padding: 10px 4px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card); color: var(--muted);
            font-size: 11px; font-weight: 600; cursor: pointer;
            font-family: 'DM Mono', monospace;
            transition: all 0.18s ease;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
        }
        .sec-btn .sec-icon { font-size: 15px; }
        .sec-btn:hover { border-color: var(--border2); color: var(--text); background: var(--card2); }
        .sec-btn:active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); transform: scale(0.97); }

        /* ── Notes Area ── */
        .notes {
            flex: 1; background: var(--bg);
            padding: 14px 16px; overflow-y: auto; min-height: 100px;
        }
        .notes-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .notes-title {
            font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--muted); font-family: 'DM Mono', monospace; font-weight: 500;
        }
        .note-count {
            font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted);
            background: var(--card); padding: 2px 8px; border-radius: 20px;
            border: 1px solid var(--border);
        }
        .notes-actions { display: flex; gap: 6px; }
        .notes-actions button {
            padding: 4px 10px; border-radius: var(--radius-sm);
            border: 1px solid var(--border); background: var(--card); color: var(--muted);
            font-size: 11px; font-weight: 600; cursor: pointer;
            font-family: 'DM Mono', monospace;
            transition: all 0.18s;
        }
        .notes-actions button:hover { border-color: var(--danger); color: var(--danger); }
        .notes-actions button:active { background: rgba(255,107,107,0.1); }

        /* ── Entries ── */
        .entry {
            padding: 10px 14px; background: var(--card); border-radius: var(--radius);
            margin-bottom: 7px; border: 1px solid var(--border);
            transition: border-color 0.2s;
            animation: entryIn 0.25s ease-out both;
        }
        @keyframes entryIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        .entry:hover { border-color: var(--border2); }
        .entry-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
        .entry-time { color: var(--muted); font-size: 10px; font-family: 'DM Mono', monospace; }
        .entry-badge {
            font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
            text-transform: uppercase; letter-spacing: 0.8px; font-family: 'DM Mono', monospace;
        }
        .badge-voice { background: rgba(0,212,170,0.15); color: var(--accent); border: 1px solid rgba(0,212,170,0.25); }
        .badge-note { background: rgba(255,217,61,0.12); color: var(--warn); border: 1px solid rgba(255,217,61,0.2); }
        .entry-text { font-size: 14px; line-height: 1.6; color: var(--text); word-break: break-word; }
        .entry textarea {
            width: 100%; background: transparent; border: none; color: var(--text);
            font-size: 14px; line-height: 1.6; resize: none; outline: none;
            font-family: 'DM Sans', sans-serif;
        }
        .entry.voice-entry { border-left: 2px solid var(--accent); }
        .entry.manual-entry { border-left: 2px solid rgba(255,217,61,0.4); }
        .entry.system-entry { border-left: 2px solid rgba(112,112,160,0.35); opacity: 0.65; }
        .entry.system-entry .entry-text { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--muted); }
        .badge-system { background: rgba(112,112,160,0.12); color: var(--muted); border: 1px solid rgba(112,112,160,0.2); }

        /* Empty state */
        .empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 20px; color: var(--muted); text-align: center; gap: 10px;
        }
        .empty-icon { font-size: 36px; opacity: 0.4; }
        .empty-text { font-size: 13px; font-family: 'DM Mono', monospace; opacity: 0.6; }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 110px; left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--card2); color: var(--text);
            padding: 11px 22px; border-radius: 22px;
            font-size: 13px; font-weight: 600;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid var(--border2);
            opacity: 0; transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2000; pointer-events: none; max-width: 90vw;
            font-family: 'DM Mono', monospace;
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success::before { content: '✓'; color: var(--accent); }
        .toast.error::before { content: '✕'; color: var(--danger); }

        /* ── Install Banner ── */
        .install-banner {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: var(--bg); padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 3000; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.34, 1.36, 0.64, 1);
        }
        .install-banner.show { transform: translateY(0); }
        .install-banner-left { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
        .install-banner button {
            background: var(--bg); color: var(--accent); border: none;
            padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;
            font-family: 'DM Mono', monospace; font-size: 12px;
        }
        .install-dismiss {
            background: transparent !important; color: rgba(0,0,0,0.4) !important;
            padding: 4px 8px !important; font-size: 18px !important;
        }

        /* Waveform animation shown when listening */
        .waveform { display: none; align-items: center; gap: 3px; height: 18px; }
        .waveform.active { display: flex; }
        .waveform span {
            display: block; width: 3px; border-radius: 2px;
            background: var(--accent); height: 4px;
        }
        .waveform span:nth-child(1) { animation: wave 1s ease-in-out infinite 0.0s; }
        .waveform span:nth-child(2) { animation: wave 1s ease-in-out infinite 0.15s; }
        .waveform span:nth-child(3) { animation: wave 1s ease-in-out infinite 0.3s; }
        .waveform span:nth-child(4) { animation: wave 1s ease-in-out infinite 0.45s; }
        .waveform span:nth-child(5) { animation: wave 1s ease-in-out infinite 0.6s; }
        @keyframes wave { 0%,100%{height:4px} 50%{height:16px} }

        #no-sleep { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

        /* Scrollbar */
        .notes::-webkit-scrollbar { width: 4px; }
        .notes::-webkit-scrollbar-track { background: transparent; }
        .notes::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo-icon">🎙️</div>
            <h1>SpeakNote <span class="version">v1.2.1</span></h1>
        </div>
        <div class="status idle" id="status">Idle</div>
    </div>

    <div class="lang-bar" id="lang-bar">
        <button class="lang-btn active" data-lang="en-US" onclick="setLang('en-US')">🇺🇸 EN</button>
        <button class="lang-btn" data-lang="es-ES" onclick="setLang('es-ES')">🇪🇸 ES</button>
        <button class="lang-btn" data-lang="fr-FR" onclick="setLang('fr-FR')">🇫🇷 FR</button>
        <button class="lang-btn" data-lang="de-DE" onclick="setLang('de-DE')">🇩🇪 DE</button>
        <button class="lang-btn" data-lang="it-IT" onclick="setLang('it-IT')">🇮🇹 IT</button>
        <button class="lang-btn" data-lang="pt-BR" onclick="setLang('pt-BR')">🇧🇷 PT</button>
        <button class="lang-btn" data-lang="ja-JP" onclick="setLang('ja-JP')">🇯🇵 JP</button>
        <button class="lang-btn" data-lang="ko-KR" onclick="setLang('ko-KR')">🇰🇷 KR</button>
        <button class="lang-btn" data-lang="zh-CN" onclick="setLang('zh-CN')">🇨🇳 CN</button>
        <button class="lang-btn" data-lang="nl-NL" onclick="setLang('nl-NL')">🇳🇱 NL</button>
    </div>

    <div class="controls">
        <button class="main-btn start" id="main-btn" onclick="toggleListening()">
            <span class="waveform" id="waveform"><span></span><span></span><span></span><span></span><span></span></span>
            <span id="btn-icon">▶</span>
            <span id="btn-text">Start Recording</span>
        </button>
        <div class="secondary">
            <button class="sec-btn" onclick="addManualNote()">
                <span class="sec-icon">✎</span><span>Note</span>
            </button>
            <button class="sec-btn" onclick="undoLast()">
                <span class="sec-icon">↩</span><span>Undo</span>
            </button>
            <button class="sec-btn" onclick="copyToClipboard()">
                <span class="sec-icon">📋</span><span>Copy</span>
            </button>
            <button class="sec-btn" onclick="exportText()">
                <span class="sec-icon">⬇</span><span>Export</span>
            </button>
        </div>
    </div>

    <div class="notes" id="notes">
        <div class="notes-header">
            <span class="notes-title">📝 Session Notes</span>
            <div style="display:flex;align-items:center;gap:8px">
                <span class="note-count" id="note-count">0 entries</span>
                <span class="notes-actions"><button onclick="clearNotes()">Clear all</button></span>
            </div>
        </div>
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">🎙️</div>
            <div class="empty-text">Press Start Recording to begin</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="install-banner" id="install-banner">
        <div class="install-banner-left">📲 Install SpeakNote for offline use</div>
        <div style="display:flex;gap:6px;align-items:center">
            <button onclick="installPWA()">Install</button>
            <button class="install-dismiss" onclick="document.getElementById('install-banner').classList.remove('show')">✕</button>
        </div>
    </div>

    <video id="no-sleep" loop muted playsinline><source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAACKBtZGF0AAAC" type="video/mp4"></video>

    <script>
const APP_VERSION = '1.2.1';
const APP_BUILD   = '2026-05-27-2';

// ── Browser / engine detection ───────────────────────────────────────────────
const UA = navigator.userAgent;
// Edge UA contains 'Chrome' AND 'WebKit' — detect it first, before Chrome
const IS_EDGE    = /Edg\//.test(UA);
const IS_CHROME  = /Chrome/.test(UA) && !IS_EDGE;
// True Safari/WebKit: has WebKit but NOT Chrome/Edge (all Chromium browsers have both)
const IS_WEBKIT  = /WebKit/.test(UA) && !IS_CHROME && !IS_EDGE;
const IS_IOS     = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_MOBILE  = IS_IOS || /Android/.test(UA);

// Engine-specific timing constants
// iOS WebKit needs more breathing room between sessions for audio session re-acquisition
// Edge on desktop is similar to Chrome; Edge on iOS is WebKit underneath
const TIMING = IS_IOS ? {
    restartDelay:      600,   // ms between sessions (WebKit audio session re-acquire)
    networkBase:      2000,   // first network retry delay
    networkBackoff:   [2000, 4000, 8000, 16000],
    maxErrors:           4
} : {
    restartDelay:       80,
    networkBase:      1000,
    networkBackoff:   [1000, 2000, 4000, 8000],
    maxErrors:           5
};

console.log('[SpeakNote] Engine:', IS_IOS ? 'iOS-WebKit' : IS_WEBKIT ? 'WebKit' : IS_EDGE ? 'Edge' : IS_CHROME ? 'Chrome' : 'Other',
            '| Mobile:', IS_MOBILE, '| Build:', APP_BUILD);

// ── Language map ─────────────────────────────────────────────────────────────
const LANG_NAMES = {
    'en-US': 'English', 'es-ES': 'Español', 'fr-FR': 'Français', 'de-DE': 'Deutsch',
    'it-IT': 'Italiano', 'pt-BR': 'Português', 'ja-JP': '日本語', 'ko-KR': '한국어',
    'zh-CN': '中文', 'nl-NL': 'Nederlands'
};

// ── Error taxonomy ───────────────────────────────────────────────────────────
const ERROR_MESSAGES = {
    'network':               'Network error — speech service unreachable.',
    'not-allowed':           'Microphone access denied. Allow mic in browser settings.',
    'no-speech':             'No speech detected.',
    'aborted':               'Session aborted.',
    'audio-capture':         'No microphone found or mic is in use by another app.',
    'service-not-allowed':   'Speech service blocked. Try a different browser.',
    'bad-grammar':           'Speech grammar error.',
    'language-not-supported':'Selected language not supported by this browser.'
};

// no-speech and aborted are normal short-session endings — don't count or log them
const IGNORABLE_ERRORS = new Set(['no-speech', 'aborted']);

// Fatal — no retry makes sense
const FATAL_ERRORS = new Set(['not-allowed', 'service-not-allowed', 'audio-capture']);

// ── State ────────────────────────────────────────────────────────────────────
let state = {
    entries: [], isListening: false, recognition: null, wakeLock: null,
    settings: { autorestart: true, lang: 'en-US' },
    consecutiveErrors: 0, lastCmdTime: 0,
    errorCount: {},
    sessionActive:    false,   // true once mic-active entry logged for this user session
    nextRestartDelay: 0,       // delay onend should use (set by onerror)
    startAttempts:    0        // guard against rapid start-fail loops
};
let deferredPrompt = null;

const els = {
    status:     document.getElementById('status'),
    mainBtn:    document.getElementById('main-btn'),
    btnIcon:    document.getElementById('btn-icon'),
    btnText:    document.getElementById('btn-text'),
    notes:      document.getElementById('notes'),
    toast:      document.getElementById('toast'),
    noSleep:    document.getElementById('no-sleep'),
    waveform:   document.getElementById('waveform'),
    noteCount:  document.getElementById('note-count'),
    emptyState: document.getElementById('empty-state'),
};

// ── Diagnostics ──────────────────────────────────────────────────────────────
function logDiag(msg, isError) {
    console[isError ? 'error' : 'log']('[SpeakNote]', msg);
    addEntry('system', (isError ? '⚠️' : 'ℹ️') + ' ' + msg);
}

// ── Init ─────────────────────────────────────────────────────────────────────
function init() {
    loadSettings();
    setupInstall();
    setupVisibilityHandler();
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(function() { console.log('[SpeakNote] SW registered'); })
            .catch(function(e) { console.warn('[SpeakNote] SW failed:', e); });
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) logDiag('Speech recognition not supported in this browser.', true);
}

// ── Visibility handler — pause/resume on tab hide/show ───────────────────────
// iOS and mobile browsers suspend audio sessions when the tab is hidden.
// We stop cleanly on hide and offer to resume on show.
function setupVisibilityHandler() {
    document.addEventListener('visibilitychange', function() {
        if (document.hidden && state.isListening) {
            console.log('[SpeakNote] Tab hidden — suspending session');
            // Soft-suspend: keep isListening=true but abort the recognition
            // so iOS releases the audio session properly
            if (state.recognition) {
                try { state.recognition.onend = null; state.recognition.abort(); } catch(e) {}
                state.recognition = null;
            }
            updateStatus('listening', 'Paused');
        } else if (!document.hidden && state.isListening) {
            console.log('[SpeakNote] Tab visible — resuming session');
            // Resume after a delay so the audio system wakes back up
            setTimeout(function() {
                if (state.isListening) _startSession();
            }, IS_IOS ? 1200 : 400);
        }
    });
}

// ── Language ─────────────────────────────────────────────────────────────────
function setLang(lang) {
    state.settings.lang = lang;
    document.querySelectorAll('.lang-btn').forEach(function(b) {
        b.classList.toggle('active', b.dataset.lang === lang);
    });
    saveSettings();
    showToast('Language: ' + LANG_NAMES[lang], 'success');
    if (state.isListening) {
        if (state.recognition) {
            try { state.recognition.onend = null; state.recognition.abort(); } catch(e) {}
            state.recognition = null;
        }
        state.sessionActive = false; // log new language on restart
        setTimeout(function() { if (state.isListening) _startSession(); },
                   IS_IOS ? 800 : 300);
    }
}

// ── Entry count ───────────────────────────────────────────────────────────────
function updateEntryCount() {
    const n = state.entries.filter(function(e) { return e.type !== 'system'; }).length;
    els.noteCount.textContent = n === 1 ? '1 entry' : n + ' entries';
    els.emptyState.style.display = state.entries.length === 0 ? 'flex' : 'none';
}

// ── Entries ───────────────────────────────────────────────────────────────────
function addEntry(type, text, editable) {
    const time  = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const entry = { type: type, text: text, time: time, ts: Date.now(), editable: !!editable };
    state.entries.unshift(entry);
    renderEntry(entry, true);
    while (state.entries.length > 200) {
        state.entries.pop();
        var all = els.notes.querySelectorAll('.entry');
        if (all.length) all[all.length - 1].remove();
    }
    updateEntryCount();
}

function renderEntry(entry, prepend) {
    const div      = document.createElement('div');
    const isVoice  = entry.type === 'voice';
    const isManual = entry.type === 'manual';
    const isSystem = entry.type === 'system';
    div.className  = 'entry' +
        (isVoice  ? ' voice-entry'  : '') +
        (isManual ? ' manual-entry' : '') +
        (isSystem ? ' system-entry' : '');
    div.dataset.ts = String(entry.ts);

    const badgeLabel = isVoice ? 'Voice' : isManual ? 'Note' : isSystem ? 'System' : '';
    const badgeClass = isVoice ? 'badge-voice' : isManual ? 'badge-note' : 'badge-system';
    const badgeHtml  = badgeLabel
        ? '<span class="entry-badge ' + badgeClass + '">' + badgeLabel + '</span>'
        : '';

    if (entry.editable) {
        div.innerHTML = '<div class="entry-meta"><span class="entry-time">' + entry.time + '</span>' + badgeHtml + '</div>' +
            '<textarea rows="1" oninput="autoResize(this);updateEntry(this)">' + escapeHtml(entry.text) + '</textarea>';
    } else {
        div.innerHTML = '<div class="entry-meta"><span class="entry-time">' + entry.time + '</span>' + badgeHtml + '</div>' +
            '<div class="entry-text">' + escapeHtml(entry.text) + '</div>';
    }

    const header = els.notes.querySelector('.notes-header');
    if (prepend && header && header.nextSibling) els.notes.insertBefore(div, header.nextSibling);
    else els.notes.appendChild(div);

    if (entry.editable) {
        const ta = div.querySelector('textarea');
        autoResize(ta);
        // Delay focus on iOS to avoid keyboard fighting with audio session
        setTimeout(function() { ta.focus(); }, IS_IOS ? 300 : 0);
    }
}

function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

function updateEntry(ta) {
    const ts = Number(ta.closest('.entry').dataset.ts);
    if (!ts) return;
    const e = state.entries.find(function(x) { return x.ts === ts; });
    if (e) e.text = ta.value;
}

function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function addManualNote() { addEntry('manual', '', true); }

function undoLast() {
    if (state.entries.length === 0) { showToast('Nothing to undo', 'error'); return; }
    state.entries.shift();
    const first = els.notes.querySelector('.entry');
    if (first) first.remove();
    showToast('Undone', 'success');
    updateEntryCount();
}

function clearNotes() {
    state.entries = [];
    els.notes.querySelectorAll('.entry').forEach(function(el) { el.remove(); });
    updateEntryCount();
    showToast('Notes cleared', 'success');
}

// ── Export ────────────────────────────────────────────────────────────────────
function buildText() {
    return state.entries.slice().reverse()
        .filter(function(e) { return e.type === 'voice' || e.type === 'manual'; })
        .map(function(e) {
            const label = e.type === 'voice' ? '[VOICE]' : '[NOTE]';
            const body  = e.text.split(/
?
/).map(function(l) { return '    ' + l; }).join('
');
            return e.time + '  ' + label + '
' + body;
        }).join('

');
}

function copyToClipboard() {
    const exportable = state.entries.filter(function(e) { return e.type === 'voice' || e.type === 'manual'; });
    if (!exportable.length) { showToast('No notes to copy', 'error'); return; }
    const text = buildText();
    function fallback() {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
        document.body.appendChild(ta); ta.focus(); ta.setSelectionRange(0, text.length);
        try { const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok; }
        catch(e) { document.body.removeChild(ta); return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
            .then(function() { showToast('Copied!', 'success'); })
            .catch(function() { fallback() ? showToast('Copied!', 'success') : showToast('Copy failed', 'error'); });
    } else {
        fallback() ? showToast('Copied!', 'success') : showToast('Copy failed', 'error');
    }
}

function exportText() {
    const exportable = state.entries.filter(function(e) { return e.type === 'voice' || e.type === 'manual'; });
    if (!exportable.length) { showToast('No notes to export', 'error'); return; }
    const text = buildText();
    const blob = new Blob([text], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'speaknote-' + new Date().toISOString().slice(0, 10) + '.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
    showToast('Exported!', 'success');
}

// ── Speech recognition ────────────────────────────────────────────────────────
// Architecture: non-continuous short sessions (continuous:false).
// Each session listens for one phrase then ends. onend restarts a fresh instance.
// This avoids the continuous-stream network error / double-restart race on all
// browsers, and is the only reliable approach on iOS WebKit.

function processCommand(t) {
    const now = Date.now();
    if (now - state.lastCmdTime < 300) return;
    state.lastCmdTime = now;
    if (!t) return;
    if (/^(stop|pause|halt)/i.test(t)) {
        stopListening();
        addEntry('system', 'Stopped by voice command');
    } else {
        state.consecutiveErrors = 0;
        addEntry('voice', t);
    }
}

function buildSession() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;

    const recog = new SR();
    // continuous:false = short-session mode. Each phrase ends the session naturally.
    // This is MORE reliable than continuous:true on all browsers, especially iOS.
    recog.continuous     = false;
    recog.interimResults = false;
    recog.lang           = state.settings.lang;

    // maxAlternatives:1 — we only need the best result
    recog.maxAlternatives = 1;

    recog.onstart = function() {
        state.startAttempts = 0; // successful start resets the rapid-fail guard
        if (!state.sessionActive) {
            state.sessionActive = true;
            updateStatus('listening', 'Listening');
            updateMainBtn();
            addEntry('system', '🎙️ Microphone active — ' + LANG_NAMES[state.settings.lang]);
            console.log('[SpeakNote] Session started');
        }
    };

    recog.onresult = function(e) {
        for (var i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) {
                processCommand(e.results[i][0].transcript.trim());
            }
        }
    };

    recog.onerror = function(e) {
        const errCode = e.error;
        state.errorCount[errCode] = (state.errorCount[errCode] || 0) + 1;
        console.error('[SpeakNote] error:', errCode,
                      '| consecutive:', state.consecutiveErrors,
                      '| total this type:', state.errorCount[errCode]);

        // Fatal — stop immediately, no retry
        if (FATAL_ERRORS.has(errCode)) {
            showToast(ERROR_MESSAGES[errCode] || errCode, 'error');
            logDiag('Fatal — ' + (ERROR_MESSAGES[errCode] || errCode), true);
            _haltSession();
            return;
        }

        // Ignorable — normal short-session end, let onend handle the restart quietly
        if (IGNORABLE_ERRORS.has(errCode)) return;

        // Countable error
        state.consecutiveErrors++;
        const friendly = ERROR_MESSAGES[errCode] || ('Unknown error: ' + errCode);
        showToast(friendly, 'error');

        if (state.consecutiveErrors >= TIMING.maxErrors) {
            logDiag('Stopped after ' + TIMING.maxErrors + ' consecutive errors. Last: ' + errCode, true);
            showToast('Stopped — too many errors', 'error');
            _haltSession();
            return;
        }

        if (errCode === 'network') {
            const delay = TIMING.networkBackoff[Math.min(state.consecutiveErrors - 1, TIMING.networkBackoff.length - 1)];
            logDiag('Network error (attempt ' + state.consecutiveErrors + ') — retrying in ' + (delay / 1000) + 's', true);
            state.nextRestartDelay = delay;
        } else {
            logDiag(friendly + ' (attempt ' + state.consecutiveErrors + ')', true);
            state.nextRestartDelay = TIMING.restartDelay * 4;
        }
        // onend fires after onerror and picks up nextRestartDelay
    };

    recog.onend = function() {
        console.log('[SpeakNote] onend | isListening:', state.isListening,
                    '| nextRestartDelay:', state.nextRestartDelay);
        if (!state.isListening) return;

        const delay = state.nextRestartDelay || TIMING.restartDelay;
        state.nextRestartDelay = 0;

        setTimeout(function() {
            if (state.isListening) _startSession();
        }, delay);
    };

    return recog;
}

function _startSession() {
    // Guard against rapid start-fail loops (e.g. mic permission not yet granted)
    state.startAttempts = (state.startAttempts || 0) + 1;
    if (state.startAttempts > 8) {
        logDiag('Too many failed start attempts — check mic permissions.', true);
        _haltSession();
        return;
    }

    // Tear down any stale instance before creating new one
    if (state.recognition) {
        try { state.recognition.onend = null; state.recognition.abort(); } catch(e) {}
        state.recognition = null;
    }

    const recog = buildSession();
    if (!recog) {
        logDiag('SpeechRecognition not available in this browser.', true);
        _haltSession();
        return;
    }

    state.recognition = recog;

    // iOS WebKit: starting recognition while the keyboard is open can fail.
    // Blur any focused element first.
    if (IS_IOS && document.activeElement && document.activeElement !== document.body) {
        document.activeElement.blur();
    }

    try {
        recog.start();
    } catch(e) {
        console.error('[SpeakNote] start() threw:', e.name, e.message);
        if (e.name === 'InvalidStateError') {
            // Already started — shouldn't happen with fresh instances, but handle it
            setTimeout(function() { if (state.isListening) _startSession(); }, 500);
        } else {
            logDiag('Could not start mic: ' + e.message, true);
            setTimeout(function() { if (state.isListening) _startSession(); }, TIMING.networkBase);
        }
    }
}

function _haltSession() {
    state.isListening      = false;
    state.sessionActive    = false;
    state.nextRestartDelay = 0;
    state.startAttempts    = 0;
    if (state.recognition) {
        try { state.recognition.onend = null; state.recognition.abort(); } catch(e) {}
        state.recognition = null;
    }
    releaseWakeLock();
    updateStatus('idle', 'Idle');
    updateMainBtn();
}

async function toggleListening() {
    try {
        if (state.isListening) {
            stopListening();
            return;
        }

        // Set listening state and update UI immediately so user sees feedback
        state.isListening      = true;
        state.consecutiveErrors = 0;
        state.sessionActive    = false;
        state.nextRestartDelay = 0;
        state.startAttempts    = 0;
        updateStatus('listening', 'Starting…');
        updateMainBtn();

        // iOS only: pre-warm audio permission via getUserMedia before recognition starts.
        // Skip on Chrome/Edge — getUserMedia is not needed and can cause permission dialogs.
        if (IS_IOS && !IS_EDGE && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(function(t) { t.stop(); });
                await new Promise(function(r) { setTimeout(r, 200); });
            } catch(e) {
                showToast('Microphone access denied', 'error');
                logDiag('getUserMedia denied: ' + e.message, true);
                _haltSession();
                return;
            }
        }

        // Wake lock: best-effort, never block on failure
        try { await acquireWakeLock(); } catch(e) { console.warn('[SpeakNote] WakeLock skipped:', e); }

        _startSession();

    } catch(e) {
        // Catch-all: if anything above throws, reset state so button is usable again
        console.error('[SpeakNote] toggleListening error:', e);
        logDiag('Start failed: ' + e.message, true);
        _haltSession();
    }
}

function stopListening() {
    state.consecutiveErrors = 0;
    _haltSession();
    addEntry('system', '⏹ Stopped');
}

// ── Wake lock ─────────────────────────────────────────────────────────────────
async function acquireWakeLock() {
    if ('wakeLock' in navigator) {
        try { state.wakeLock = await navigator.wakeLock.request('screen'); return; }
        catch(e) { console.warn('[SpeakNote] WakeLock failed:', e); }
    }
    // Fallback: tiny silent video loop keeps screen awake on older iOS
    try { await els.noSleep.play(); } catch(e) {}
}
function releaseWakeLock() {
    if (state.wakeLock) { state.wakeLock.release().catch(function(){}); state.wakeLock = null; }
    try { els.noSleep.pause(); } catch(e) {}
}

// ── UI ────────────────────────────────────────────────────────────────────────
function updateStatus(type, text) {
    els.status.className   = 'status ' + type;
    els.status.textContent = text;
}
function updateMainBtn() {
    if (state.isListening) {
        els.mainBtn.className   = 'main-btn stop';
        els.btnIcon.textContent = '⏹';
        els.btnText.textContent = 'Stop Recording';
        els.waveform.classList.add('active');
    } else {
        els.mainBtn.className   = 'main-btn start';
        els.btnIcon.textContent = '▶';
        els.btnText.textContent = 'Start Recording';
        els.waveform.classList.remove('active');
    }
}

let toastTimer;
function showToast(msg, type) {
    clearTimeout(toastTimer);
    els.toast.textContent = msg;
    els.toast.className   = 'toast show ' + (type || '');
    toastTimer = setTimeout(function() { els.toast.classList.remove('show'); }, 3200);
}

// ── Settings ──────────────────────────────────────────────────────────────────
function loadSettings() {
    try {
        const s = localStorage.getItem('speaknote_settings');
        if (s) Object.assign(state.settings, JSON.parse(s));
    } catch(e) { console.warn('[SpeakNote] Could not load settings:', e); }
    setLang(state.settings.lang);
}
function saveSettings() {
    try { localStorage.setItem('speaknote_settings', JSON.stringify(state.settings)); }
    catch(e) { console.warn('[SpeakNote] Could not save settings:', e); }
}

// ── PWA install ───────────────────────────────────────────────────────────────
function setupInstall() {
    window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault(); deferredPrompt = e;
        document.getElementById('install-banner').classList.add('show');
    });
    window.addEventListener('appinstalled', function() {
        deferredPrompt = null;
        document.getElementById('install-banner').classList.remove('show');
        showToast('SpeakNote installed!', 'success');
    });
}
async function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const r = await deferredPrompt.userChoice;
    if (r.outcome === 'accepted') document.getElementById('install-banner').classList.remove('show');
    deferredPrompt = null;
}

init();
    </script>
